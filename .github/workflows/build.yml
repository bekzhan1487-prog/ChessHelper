name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Stockfish
        run: |
          wget -q https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-android-armv8.tar
          tar -xf stockfish-android-armv8.tar
          ls -la
          find . -name "stockfish*" -type f
          mkdir -p app/src/main/assets
          find . -name "stockfish" -type f | head -1 | xargs -I{} cp {} app/src/main/assets/stockfish

      - name: Create gradlew
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          gradle-8.0/bin/gradle wrapper
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper
          path: app/build/outputs/apk/debug/app-debug.apk
